# Put this directive in the nginx `http` block.
limit_req_zone $binary_remote_addr zone=fablevia_feedback_per_ip:10m rate=2r/m;

# Put this exact-match location inside the existing TLS-enabled www.leankom.com server block.
location = /api/fablevia-feedback/v1/reports {
    client_max_body_size 16k;
    limit_except POST { deny all; }
    limit_req zone=fablevia_feedback_per_ip burst=4 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:18081/v1/feedback;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
}
